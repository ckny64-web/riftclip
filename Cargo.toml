[workspace]
resolver = "2"
members = ["crates/league", "crates/library", "crates/recorder", "crates/engine", "crates/proto", "crates/overlay", "app/src-tauri"]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"

[profile.release]
opt-level = 3
lto = "thin"
