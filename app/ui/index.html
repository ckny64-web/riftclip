<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Riftclip</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <div class="brand"><span class="logo"></span>Riftclip</div>
  <nav class="tabs" id="tabs">
    <button data-tab="matches" class="active">Matches</button>
    <button data-tab="clips">Clips</button>
    <button data-tab="settings">Settings</button>
  </nav>
  <div class="spacer"></div>
  <div class="status" id="status"><span class="dot"></span><span id="status-text">Starting …</span></div>
</header>

<main id="view-matches" class="view matches">
  <aside class="match-list" id="match-list"></aside>
  <section class="match-view" id="match-view"></section>
</main>

<main id="view-clips" class="view clips" hidden>
  <div class="clips-head">
    <h2>All clips</h2>
    <div class="seg" id="clip-filter">
      <button data-filter="all" class="active">All</button>
      <button data-filter="auto">Automatic</button>
      <button data-filter="manual">Saved by me</button>
    </div>
  </div>
  <div class="clip-grid" id="clip-grid"></div>
</main>

<main id="view-settings" class="view settings" hidden>
  <form id="settings-form" autocomplete="off"></form>
</main>

<div class="modal" id="modal" hidden><div class="modal-box" id="modal-box"></div></div>
<div class="toasts" id="toasts"></div>
<div class="tip" id="tip" hidden></div>

<script src="app.js"></script>
</body>
</html>
