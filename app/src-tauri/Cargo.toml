[package]
name = "riftclip-app"
edition.workspace = true
version.workspace = true
license.workspace = true

[[bin]]
name = "riftclip-app"
path = "src/main.rs"

[features]
default = ["bundled-sqlite"]
# Only switched off to type-check for Windows from Linux.
bundled-sqlite = ["engine/bundled-sqlite", "library/bundled-sqlite"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
engine = { path = "../../crates/engine", default-features = false }
league = { path = "../../crates/league" }
library = { path = "../../crates/library", default-features = false }
proto = { path = "../../crates/proto" }
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Diagnostics_Debug", "Win32_UI_WindowsAndMessaging"] }
