[package]
name = "overlay"
edition.workspace = true
version.workspace = true
license.workspace = true

[[bin]]
name = "riftclip-overlay"
path = "src/main.rs"

[dependencies]
proto = { path = "../proto" }
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts"] }
raw-window-handle = "0.6"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

# Only so the crate (and its unit tests) also builds on Linux during development.
[target.'cfg(not(windows))'.dependencies]
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts", "x11"] }
